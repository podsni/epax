name: release

# Triggered by a version tag push (e.g. v0.1.0) OR manually from the
# Actions tab where you can pick the exact version to publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build and release (e.g. v0.2.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          # When triggered via workflow_dispatch, check out the given tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --target ${{ matrix.target }}


      # ── Package ───────────────────────────────────────────────────────────
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          ASSET_NAME="epax-${TARGET}"
          mkdir -p "dist/${ASSET_NAME}"
          cp "target/${TARGET}/release/epax" "dist/${ASSET_NAME}/"
          cp README.md "dist/${ASSET_NAME}/"
          tar -C dist -czf "dist/${ASSET_NAME}.tar.gz" "${ASSET_NAME}"
          echo "ASSET=dist/${ASSET_NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${ASSET_NAME}.tar.gz"  >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          ASSET_NAME="epax-${TARGET}"
          mkdir -p "dist/${ASSET_NAME}"
          cp "target/${TARGET}/release/epax.exe" "dist/${ASSET_NAME}/"
          cp README.md "dist/${ASSET_NAME}/"
          7z a "dist/${ASSET_NAME}.zip" "./dist/${ASSET_NAME}"
          echo "ASSET=dist/${ASSET_NAME}.zip"     >> "$GITHUB_ENV"
          echo "ASSET_NAME=${ASSET_NAME}.zip"      >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epax-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Collect every archive from the artifact directories
          ASSETS=$(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | tr '\n' ' ')

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release already exists — upload / overwrite assets only
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "epax $TAG" \
              --generate-notes
          fi
