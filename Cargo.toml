[package]
name = "epax"
version = "0.5.2"
edition = "2024"

[features]
# RAR extraction is on by default. It links the vendored C++ `unrar` sources,
# which require a working C++ toolchain (and, when targeting Windows, the MSVC
# SDK — mingw-w64 lacks headers such as PowrProf.h). Disable with
# `--no-default-features` to build the all-Rust core (zip/7z/gz/bz2/zst/tar)
# on toolchains where unrar will not compile.
#
# `parse` adds `epax parse` / `epax inspect` via liteparse (PDFium + optional
# Tesseract). Disable with `--no-default-features` for a pure-Rust binary.
default = ["rar", "parse"]
rar = ["dep:unrar"]
parse = [
    "dep:liteparse",
    "dep:tokio",
    "dep:quick-xml",
    "dep:calamine",
    "dep:ocrs",
    "dep:rten",
    "dep:ocr-rs",
]

[dependencies]
bzip2 = "0.6.1"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
sevenz-rust2 = "0.21.0"
tar = "0.4.46"
thiserror = "2.0.18"
unrar = { version = "0.5.8", optional = true }

# Minimal tokio runtime used to drive the async liteparse API synchronously.
tokio = { version = "1", optional = true, features = ["rt"] }
# Pure-Rust XML parser — used to extract text from DOCX and PPTX archives
# without any external tools (no LibreOffice needed).
quick-xml = { version = "0.40", optional = true }
# Pure-Rust Excel reader — extracts text/numbers from XLSX without conversion.
calamine = { version = "0.35", optional = true }
walkdir = "2.5.0"
zip = "8.6.0"
zstd = "0.13.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ocrs = { version = "0.12.2", optional = true }
rten = { version = "0.24.0", optional = true }
ocr-rs = { version = "2.2.2", optional = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[target.'cfg(not(windows))'.dependencies]
liteparse = { version = "2", optional = true, features = ["tesseract"] }

[target.'cfg(windows)'.dependencies]
liteparse = { version = "2", optional = true, default-features = false }
