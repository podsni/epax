[package]
name = "epax"
version = "0.4.0"
edition = "2024"

[features]
# RAR extraction is on by default. It links the vendored C++ `unrar` sources,
# which require a working C++ toolchain (and, when targeting Windows, the MSVC
# SDK — mingw-w64 lacks headers such as PowrProf.h). Disable with
# `--no-default-features` to build the all-Rust core (zip/7z/gz/bz2/zst/tar)
# on toolchains where unrar will not compile.
default = ["rar"]
rar = ["dep:unrar"]

[dependencies]
bzip2 = "0.6.1"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
sevenz-rust2 = "0.21.0"
tar = "0.4.46"
thiserror = "2.0.18"
unrar = { version = "0.5.8", optional = true }
walkdir = "2.5.0"
zip = "8.6.0"
zstd = "0.13.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
